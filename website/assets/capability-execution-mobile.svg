<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="title desc"><title id="title">Execution compilation</title><desc id="desc">A blueprint becomes a structured executor handoff and result package.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#168779" stroke-width="1.5"/></marker></defs><rect width="360" height="500" fill="#fbfcfe"/><rect x="44" y="24" width="272" height="96" rx="13" fill="#fff" stroke="#d5e0ec"/><text x="64" y="59" fill="#17263e" font-size="18" font-weight="650">Accepted blueprint</text><text x="64" y="87" fill="#66778d" font-size="14">mechanism · baselines · evaluation</text><path d="M180 120V148" stroke="#168779" stroke-width="2" marker-end="url(#a)"/><rect x="44" y="160" width="272" height="132" rx="14" fill="#edf8f5" stroke="#168779"/><text x="64" y="197" fill="#17263e" font-size="18" font-weight="650">Compile execution handoff</text><text x="64" y="226" fill="#66778d" font-size="14">project Skills · protocol</text><text x="64" y="253" fill="#66778d" font-size="14">resource contract · claim boundary</text><path d="M180 292V320" stroke="#168779" stroke-width="2" marker-end="url(#a)"/><rect x="44" y="332" width="272" height="70" rx="13" fill="#17263e"/><text x="180" y="364" fill="#fff" font-size="18" font-weight="650" text-anchor="middle">External executor</text><text x="180" y="388" fill="#aebdd1" font-size="13" text-anchor="middle">Codex · Claude Code · human</text><path d="M180 402V430" stroke="#168779" stroke-width="2" marker-end="url(#a)"/><rect x="44" y="442" width="272" height="42" rx="10" fill="#fff" stroke="#d5e0ec"/><text x="180" y="468" fill="#17263e" font-size="16" font-weight="650" text-anchor="middle">Structured result handoff</text></svg>
