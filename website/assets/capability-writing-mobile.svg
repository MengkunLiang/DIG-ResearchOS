<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="title desc"><title id="title">Evidence to manuscript</title><desc id="desc">Accepted evidence is routed into manuscript sections and claim audited.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a56b24" stroke-width="1.5"/></marker></defs><rect width="360" height="500" fill="#fbfcfe"/><rect x="44" y="22" width="272" height="108" rx="13" fill="#fff" stroke="#d5e0ec"/><text x="64" y="57" fill="#17263e" font-size="18" font-weight="650">Accepted evidence</text><text x="64" y="85" fill="#66778d" font-size="14">papers · facts · figures · tables</text><text x="64" y="111" fill="#66778d" font-size="14">claim boundaries</text><path d="M180 130V158" stroke="#a56b24" stroke-width="2" marker-end="url(#a)"/><rect x="44" y="170" width="272" height="146" rx="14" fill="#fbf4e9" stroke="#a56b24"/><text x="64" y="207" fill="#17263e" font-size="18" font-weight="650">Section evidence router</text><text x="64" y="237" fill="#66778d" font-size="14">Introduction · Related Work</text><text x="64" y="264" fill="#66778d" font-size="14">Method · Experiments · Analysis</text><text x="64" y="291" fill="#66778d" font-size="14">evidence routed by role</text><path d="M180 316V344" stroke="#a56b24" stroke-width="2" marker-end="url(#a)"/><rect x="44" y="356" width="272" height="64" rx="12" fill="#fff" stroke="#d5e0ec"/><text x="180" y="383" fill="#17263e" font-size="17" font-weight="650" text-anchor="middle">Draft · review · revise</text><text x="180" y="407" fill="#66778d" font-size="13" text-anchor="middle">section by section</text><path d="M180 420V444" stroke="#a56b24" stroke-width="2" marker-end="url(#a)"/><rect x="78" y="452" width="204" height="38" rx="10" fill="#17263e"/><text x="180" y="476" fill="#fff" font-size="16" font-weight="650" text