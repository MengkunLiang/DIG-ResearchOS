<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="title desc"><title id="title">Idea evolution</title><desc id="desc">Opportunity routes become candidates that are scored and evolved.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7860c4" stroke-width="1.5"/></marker></defs><rect width="360" height="500" fill="#fbfcfe"/><rect x="48" y="24" width="264" height="74" rx="13" fill="#f2effb" stroke="#7860c4"/><text x="68" y="56" fill="#17263e" font-size="18" font-weight="650">Opportunity map</text><text x="68" y="82" fill="#66778d" font-size="14">evidence-led routes</text><path d="M180 98V126" stroke="#7860c4" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="138" width="276" height="104" rx="13" fill="#fff" stroke="#d5e0ec"/><text x="62" y="174" fill="#17263e" font-size="18" font-weight="650">Candidate portfolio</text><text x="62" y="202" fill="#66778d" font-size="14">A · B · C · …</text><text x="62" y="226" fill="#66778d" font-size="14">mechanism · hypothesis · test</text><path d="M180 242V270" stroke="#7860c4" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="282" width="276" height="92" rx="13" fill="#f2effb" stroke="#7860c4"/><text x="62" y="316" fill="#17263e" font-size="17" font-weight="650">Score · mutate · cross over</text><text x="62" y="344" fill="#66778d" font-size="14">re-evaluate · survive</text><path d="M180 374V402" stroke="#7860c4" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="414" width="276" height="62" rx="12" fill="#17263e"/><text x="180" y="451" fill="#fff" font-size="17" font-weight="650" text-anchor="middle">Researcher-selected direction</text></svg>
