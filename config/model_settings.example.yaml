# ResearchOS 模型连接 / model connection
# 本 example 不会被 runtime 读取。运行 `python -m researchos.cli configure-llm`
# 会自动创建本地 config/model_settings.yaml；也可以复制本文件后手动填写。
# This example is not loaded by the runtime. Configure the real local file with
# `python -m researchos.cli configure-llm`, or copy this file and edit it.
# 这是普通用户唯一需要修改的模型配置文件。它被 Git 忽略，因为可包含 API key。
# It is the only everyday model configuration file and is ignored by Git.
# 当真实 model_settings.yaml 已完整配置时，首次 run/resume 会跳过配置向导；
# 如果文件缺失或字段不完整，TTY 会显示 Rich 配置卡并逐项询问。
# A complete real model_settings.yaml skips setup on run/resume. A missing or
# incomplete file opens a Rich, step-by-step setup flow in an interactive TTY.

# 常用 preset：openai、anthropic、openrouter、deepseek、siliconflow、google、
# groq、together、fireworks、mistral、cohere、xai、perplexity、cerebras、
# nvidia_nim、moonshot、zhipu、qwen、minimax、ollama、lm_studio、vllm。
# 其他 OpenAI-compatible endpoint 使用 openai_compatible；完整列表见 docs/cn/config.md。
provider: deepseek

# 已知 provider 留空也会使用官方默认 URL；自建 relay 可在此覆盖。
# openai_compatible 必须填写该字段。
api_base: https://api.deepseek.com

# 可直接填写 key，或引用 .env，例如 "${DEEPSEEK_API_KEY}"。
# 留空时会检查该 provider 的惯例环境变量。
# 交互输入会隐藏完整 key；系统只显示掩码、长度和末尾校验位以确认已保存。
# Interactive entry never echoes the key; it confirms a masked value, length,
# and final characters after the value has been saved.
api_key: "${DEEPSEEK_API_KEY}"

# 所有 Agent 和 Skill 使用同一个 model；没有 heavy/medium/light 或单 Agent 路由。
model: deepseek-v4-pro

# provider 无法报告真实 context window 时使用的总上下文容量（token）。它由
# system prompt、研究材料、历史、Tool 输入/结果和回复空间共同使用，不是单次输入上限。
# provider 报告可核验的真实容量时会优先使用真实值。通常保留默认值。
# Total context capacity fallback (tokens) when the provider cannot report a
# real window. It is shared by prompts, research material, history, Tool I/O,
# and response space; provider-reported capacity takes priority.
context_window_fallback: 131072

# 到达总上下文容量前的历史压缩阈值。默认直接根据 provider 已报告的容量或
# context_window_fallback 计算；通常只需调整上面的 context_window_fallback。
# History-compaction thresholds before the effective total context capacity.
# It follows provider-reported capacity or context_window_fallback by default,
# so ordinary users only need to adjust context_window_fallback above.
truncation:
  trigger_ratio: 0.90
  target_ratio: 0.72

# 高级 gateway 兼容覆盖（默认不需要）：如某个 gateway 虽报告了大 context，
# 却要求更小的单次历史输入，可在 truncation 内显式加入正整数
# max_input_tokens。它只压缩旧对话/Tool 轮次，不减少 PDF 分页阅读或已保存笔记。
# Advanced gateway compatibility override (normally unnecessary): add a positive
# truncation.max_input_tokens only when a gateway requires a smaller retained
# history input despite reporting a larger context. It never reduces PDF page
# reading or durable notes.

# 本地 token 限流默认关闭：provider/account 的实际 TPM/RPM 配额才是权威。
# 仅当你知道该连接的配额且希望平滑并发时才启用。它不是上下文容量，不能从
# context_window_fallback 推导。启用时 burst 必须不小于你允许发送的最大请求；
# 若单请求超过 burst，ResearchOS 会交给 provider 而不会无限等待。
# Local token throttling is off by default; the provider/account TPM/RPM quota
# is authoritative. Enable only when those quotas are known and you want to
# smooth concurrency. It is not context capacity and must not be derived from
# context_window_fallback. If a request exceeds burst, ResearchOS sends it to
# the provider rather than waiting forever.
rate_limit:
  enabled: false
  tokens_per_minute: 200000
  burst: 200000

# 同一 provider/model 临时故障时的重试策略，不会暗中切换到其他模型。
# request_timeout_seconds 是每一次正式科研模型请求允许等待的最长时间；它和
# 同块中的重试参数一起控制官方 API，不需要去修改 system_config。认证或配置
# 错误不会重试，CLI 会提示需要修正的内容。
# Retry policy for temporary failure of the same provider/model; it never
# silently changes models. request_timeout_seconds is the deadline for each
# research-model request and belongs here with retry behaviour, not in
# system_config.
fallback:
  request_timeout_seconds: 120
  max_attempts: 3
  initial_wait_seconds: 3
  max_wait_seconds: 20
  retry_after_timeout: true
