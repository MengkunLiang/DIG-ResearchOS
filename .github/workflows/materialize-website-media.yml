name: Materialize website media

on:
  push:
    branches:
      - feat/project-website-v2
    paths:
      - .media-upload/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-website-v2
          fetch-depth: 0
      - name: Decode media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/assets
          cat .media-upload/mp4/part-* | tr -d '\n' | base64 --decode > website/assets/researchos-main-flow.mp4
          cat .media-upload/poster/part-* | tr -d '\n' | base64 --decode > website/assets/researchos-demo-poster.webp
          test -s website/assets/researchos-main-flow.mp4
          test -s website/assets/researchos-demo-poster.webp
          rm -rf .media-upload
          rm -f .github/workflows/materialize-website-media.yml
      - name: Commit media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(website): add optimized real demo media"
          git push origin HEAD:feat/project-website-v2
