name: Render Chinese ResearchOS demo

on:
  push:
    branches: ["feat/chinese-demo-video"]
    paths:
      - ".github/workflows/render-cn-demo.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/chinese-demo-video

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate Chinese neural narration
        shell: bash
        run: |
          mkdir -p .render-cn
          edge-tts --voice zh-CN-XiaoxiaoNeural --rate=-4% --pitch=-1Hz --text 'ResearchOS 从研究目标和约束开始，把项目保存在持续可追踪的工作区中。' --write-media .render-cn/01.mp3
          edge-tts --voice zh-CN-XiaoxiaoNeural --rate=-4% --pitch=-1Hz --text '论文会被逐篇阅读并整理成结构化证据，保留机制、结论和来源边界。' --write-media .render-cn/02.mp3
          edge-tts --voice zh-CN-XiaoxiaoNeural --rate=-4% --pitch=-1Hz --text '跨论文综合提炼共识、矛盾和开放问题，形成可继续推演的研究空间。' --write-media .render-cn/03.mp3
          edge-tts --voice zh-CN-XiaoxiaoNeural --rate=-4% --pitch=-1Hz --text '系统据此生成多个候选方向，独立评分，并通过受约束的演化持续优化。' --write-media .render-cn/04.mp3
          edge-tts --voice zh-CN-XiaoxiaoNeural --rate=-4% --pitch=-1Hz --text '最终由研究者选择方向，研究记录继续进入方案、实验和论文写作。' --write-media .render-cn/05.mp3

      - name: Write subtitles
        shell: bash
        run: |
          cat > .render-cn/subtitles.srt <<'EOF'
          1
          00:00:00,500 --> 00:00:07,420
          ResearchOS 从研究目标和约束开始，
          把项目保存在持续可追踪的工作区中。

          2
          00:00:07,600 --> 00:00:14,650
          论文会被逐篇阅读并整理成结构化证据，
          保留机制、结论和来源边界。

          3
          00:00:14,800 --> 00:00:21,370
          跨论文综合提炼共识、矛盾和开放问题，
          形成可继续推演的研究空间。

          4
          00:00:21,600 --> 00:00:28,320
          系统据此生成多个候选方向，独立评分，
          并通过受约束的演化持续优化。

          5
          00:00:28,600 --> 00:00:35,080
          最终由研究者选择方向，
          研究记录继续进入方案、实验和论文写作。
          EOF

      - name: Render final MP4
        shell: bash
        run: |
          ffmpeg -y \
            -i website/assets/researchos-main-flow.mp4 \
            -i .render-cn/01.mp3 -i .render-cn/02.mp3 -i .render-cn/03.mp3 -i .render-cn/04.mp3 -i .render-cn/05.mp3 \
            -filter_complex "[1:a]atempo=1.08,adelay=500|500[a1];[2:a]atempo=1.08,adelay=7600|7600[a2];[3:a]atempo=1.08,adelay=14800|14800[a3];[4:a]atempo=1.08,adelay=21600|21600[a4];[5:a]atempo=1.08,adelay=28600|28600[a5];anullsrc=r=48000:cl=mono:d=36.34[sil];[sil][a1][a2][a3][a4][a5]amix=inputs=6:normalize=0:duration=longest,alimiter=limit=0.96[aout];[0:v]subtitles=.render-cn/subtitles.srt:fontsdir=/usr/share/fonts/opentype/noto:force_style='FontName=Noto Sans CJK SC,FontSize=20,PrimaryColour=&H00FFFFFF,OutlineColour=&H66000000,BorderStyle=3,BackColour=&H7A000000,Outline=0,Shadow=0,MarginV=24,Alignment=2'[vout]" \
            -map "[vout]" -map "[aout]" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 48000 -ac 1 \
            -movflags +faststart -t 36.333333 \
            website/assets/researchos-main-flow-cn.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height,sample_rate,channels -of json website/assets/researchos-main-flow-cn.mp4

      - name: Commit rendered video
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/researchos-main-flow-cn.mp4
          git rm .github/workflows/render-cn-demo.yml
          git commit -m "feat: add Chinese narrated ResearchOS demo"
          git push origin HEAD:feat/chinese-demo-video
